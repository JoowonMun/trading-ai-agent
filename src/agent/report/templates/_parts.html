{# 여러 메일 템플릿이 함께 쓰는 조각 #}
{% macro move_reason(r) -%}
{% if r %}
<div style="margin:8px 0 0;padding:8px 10px;background:#f0f9ff;border-left:3px solid #0369a1;font-size:13px;">
  <strong>🔎 왜 움직였나</strong> — {{ r.summary }}
  {% if r.sources %}<div style="margin-top:4px;font-size:12px;color:#57534e;">출처: {% for s in r.sources %}<a href="{{ s }}" style="color:#0369a1;">{{ s|domain }}</a>{% if not loop.last %} · {% endif %}{% endfor %}</div>{% endif %}
</div>
{% endif %}
{%- endmacro %}

[project]
name = "trading-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pykrx>=1.2.9",
    "setuptools<81",  # pykrx가 pkg_resources를 import (setuptools 81에서 제거 예정)
    "yfinance",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["live: 실제 외부 API를 호출하는 테스트"]
addopts = ["-m", "not live"]

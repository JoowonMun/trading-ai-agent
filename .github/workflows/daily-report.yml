name: daily-report

on:
  schedule:
    - cron: "17 21 * * 0-4"   # 월~금 06:17 KST (UTC 전날 21:17). GitHub 예약은 정각에 몰려 수십 분~2시간 밀릴 수 있어 일찍·비정각으로
  workflow_dispatch:          # Actions 탭에서 수동 실행
    inputs:
      dry_run:
        description: "메일을 보내지 않고 점검만"
        type: boolean
        default: false

concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: read

# 비밀값은 job 전체가 아니라 필요한 단계에만 준다 — 웹을 읽는 AI 단계가 다른 키에 닿지 못하게
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: 기록 저장소 체크아웃 (비공개, 실패하면 첫 실행처럼 진행)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: JoowonMun/trading-ai-agent-data
          path: data
          ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}

      - uses: astral-sh/setup-uv@v5

      - name: 의존성 설치
        run: uv sync --frozen > /dev/null

      - name: 설정 파일 준비 (나무 계좌는 API로 조회하므로 수동 보유는 비움)
        run: |
          printf 'accounts: []\ncash_krw: 0\n' > config/holdings.yaml

      - name: 기준일 계산 (한국시간)
        run: |
          echo "REPORT_DATE=$(uv run python -c 'from agent.config import today_kst; print(today_kst())')" >> "$GITHUB_ENV"

      - name: DART 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: .cache/dart
          key: dart-${{ github.run_id }}
          restore-keys: dart-

      # 로그는 공개다 — 보유 내역이 담긴 출력은 파일로만 남기고 화면에는 성공/실패·개수만
      - name: 데이터 수집·계산 (실패 시 실패 알림 메일)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NH_APP_KEY: ${{ secrets.NH_APP_KEY }}
          NH_APP_SECRET: ${{ secrets.NH_APP_SECRET }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          mkdir -p out
          DRY=""; [ "${{ inputs.dry_run }}" = "true" ] && DRY="--dry-run"
          if timeout 1500 uv run python -m agent collect --notify-on-error $DRY --history-dir data --date "$REPORT_DATE" > out/collect.log 2>&1; then
            echo "수집 완료"
            CTX="out/$REPORT_DATE/context.json"
            REPORT_TYPE=$(uv run python -c "import json; print(json.load(open('$CTX', encoding='utf-8'))['report_type'])")
            RESEARCH_COUNT=$(uv run python -c "import json; print(len(json.load(open('$CTX', encoding='utf-8'))['research_targets']))")
            echo "REPORT_TYPE=$REPORT_TYPE" >> "$GITHUB_ENV"
            echo "RESEARCH_COUNT=$RESEARCH_COUNT" >> "$GITHUB_ENV"
            echo "메일 종류: $REPORT_TYPE · 원인 조사 대상 ${RESEARCH_COUNT}종목"
            grep -E "WARNING|ERROR|13F" out/collect.log | sed -E 's/(KR|US):[A-Za-z0-9.-]+/\1:<종목>/g; s/[0-9]{6,}/<num>/g' | cut -c1-160 || true
          else
            echo "수집 실패 또는 25분 초과"
            grep -vE "^\s*$" out/collect.log | tail -n 15 | sed -E 's/(KR|US):[A-Za-z0-9.-]+/\1:<종목>/g; s/[0-9]{6,}/<num>/g' | cut -c1-160; exit 1
          fi

      - name: DART 캐시 저장 (수집이 실패해도 받은 보고서는 다음 실행에서 재사용)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/dart
          key: dart-${{ github.run_id }}

      # 웹을 읽는 조사 담당 AI: 도구는 WebSearch·WebFetch뿐(파일·명령 없음), 비밀값은 Claude 토큰뿐
      - name: 원인 조사 (웹 검색 전용 AI)
        if: env.REPORT_TYPE != 'none' && env.RESEARCH_COUNT != '0'
        continue-on-error: true   # 실패해도 조사 없이 발송
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          PROMPT="$(uv run python -m agent research-prompt --date "$REPORT_DATE" 2>/dev/null)"
          if timeout 600 npx -y @anthropic-ai/claude-code@2.1.301 -p "$PROMPT" \
              --model claude-opus-5-5 \
              --tools "WebSearch,WebFetch" \
              --allowedTools "WebSearch" "WebFetch" \
              --output-format json < /dev/null > "out/$REPORT_DATE/research_raw.json" 2> out/research.err; then
            uv run python -m agent research-save --date "$REPORT_DATE" > out/research.log 2>&1
            echo "원인 조사 완료"; grep -oE "원인 조사 결과: [0-9]+종목" out/research.log || true
          else
            echo "원인 조사 실패 또는 10분 초과 — 조사 없이 발송"; exit 1
          fi

      # 해설 담당 AI: 파일 읽기·쓰기와 검증 명령만, 웹 도구 없음
      - name: AI 해설 작성 (Claude Code, 구독 인증)
        if: env.REPORT_TYPE != 'none'   # 메일을 안 보내는 날은 건너뛴다
        continue-on-error: true   # 실패해도 숫자 리포트는 발송
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          PROMPT="$(sed "s/{{DATE}}/$REPORT_DATE/g" prompts/daily-prompt.md)"
          if timeout 600 npx -y @anthropic-ai/claude-code@2.1.301 -p "$PROMPT" \
              --model claude-opus-5-5 \
              --permission-mode acceptEdits \
              --tools "Read,Write,Edit,Bash" \
              --allowedTools "Read" "Write" "Edit" "Bash(uv run python -m agent check:*)" \
              --output-format json < /dev/null > out/claude.json 2>&1; then
            echo "AI 해설 작성 완료"
          else
            STATUS=$(uv run python -c "import json; d=json.load(open('out/claude.json', encoding='utf-8')); print(d.get('subtype'), d.get('is_error'))" 2>/dev/null || echo "알 수 없음")
            echo "AI 해설 실패 또는 10분 초과 — 숫자 리포트로 발송 ($STATUS)"; exit 1
          fi

      - name: 검증 후 메일 발송
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          DRY=""; [ "${{ inputs.dry_run }}" = "true" ] && DRY="--dry-run"
          if uv run python -m agent publish --notify-on-error $DRY --date "$REPORT_DATE" > out/publish.log 2>&1; then
            if [ "$REPORT_TYPE" = "none" ]; then echo "변화 없음 — 발송 생략"; else
              echo "발송 완료"; grep -oE "AI 해설 상태: .*" out/publish.log || echo "AI 해설 없음"; fi
          else
            echo "발송 실패"; tail -n 3 out/publish.log | sed -E 's/(KR|US):[A-Za-z0-9.-]+/\1:<종목>/g; s/[0-9]{6,}/<num>/g'; exit 1
          fi

      - name: 오늘 스냅샷을 기록 저장소에 저장 (시험 실행은 저장하지 않음)
        if: ${{ inputs.dry_run != true }}
        run: |
          # 기록 저장소 체크아웃이 실패했다면 data/는 공개 저장소 안의 빈 폴더다 — 보유 내역이 공개 쪽에 커밋되지 않게 멈춘다
          [ -d data/.git ] || { echo "기록 저장소 없음 — 스냅샷 저장 생략"; exit 1; }
          if ! uv run python -m agent save-snapshot --history-dir data --date "$REPORT_DATE" > out/snapshot.log 2>&1; then
            echo "스냅샷 생성 실패"; tail -n 3 out/snapshot.log | sed -E 's/(KR|US):[A-Za-z0-9.-]+/\1:<종목>/g; s/[0-9]{6,}/<num>/g'; exit 1
          fi
          cd data
          git config user.name "trading-ai-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "스냅샷 변경 없음"; else
            git commit -qm "snapshot $REPORT_DATE" && git push -q && echo "스냅샷 저장 완료"; fi
